<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ФК ГазМяс — Официальный портал</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: #151921;
      --accent: #ffd700;
      --primary: #c90000;
      --text: #ffffff;
      --muted: #8b949e;
      --border: #2d333b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: #11141a;
      border-bottom: 2px solid var(--accent);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand { font-size: 1.4rem; font-weight: 900; text-transform: uppercase; color: var(--accent); letter-spacing: 1px; }

    .nav-actions { display: flex; gap: 0.8rem; align-items: center; }

    .btn-action {
      background: var(--primary);
      color: #fff;
      border: 1px solid var(--accent);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.85rem;
      transition: opacity 0.2s;
    }
    .btn-action:hover { opacity: 0.9; }

    .btn-sugar {
      background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
      border: 1px solid #f472b6;
    }

    .btn-idea {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: 1px solid #34d399;
    }

    .search-panel {
      padding: 1.5rem 2rem 0.5rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 250px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    .search-input:focus { outline: none; border-color: var(--accent); }

    main { flex: 1; padding: 1.5rem 2rem; max-width: 1400px; margin: 0 auto; width: 100%; }

    .squad-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }
    .player-card:hover { transform: translateY(-4px); border-color: var(--accent); }

    .card-photo-wrap {
      width: 100%;
      height: 250px;
      background: #000;
      position: relative;
    }
    .card-photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .tag-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .tag-badge.alt { border-color: #38bdf8; color: #38bdf8; }

    .card-body { padding: 1.2rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; }
    .card-title { font-size: 1.1rem; font-weight: 800; color: #fff; line-height: 1.3; }
    .card-caption { font-size: 0.9rem; color: var(--muted); line-height: 1.45; flex: 1; }

    .card-user-actions {
      display: flex;
      border-top: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.2);
    }
    .btn-card-action {
      flex: 1;
      padding: 0.65rem;
      border: none;
      background: transparent;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
    }
    .btn-card-action:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
    .btn-card-action.del:hover { color: #f87171; background: rgba(218, 54, 51, 0.15); }
    .btn-card-action.edit:hover { color: var(--accent); background: rgba(255, 215, 0, 0.1); }

    /* Модальные окна */
    .user-modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .user-modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .user-modal h3 { color: var(--accent); font-size: 1.15rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .form-group label { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    .form-group input, .form-group textarea {
      background: #0b0e14;
      border: 1px solid var(--border);
      color: #fff;
      padding: 0.65rem;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); outline: none; }

    .user-modal-btns { display: flex; gap: 0.8rem; margin-top: 0.5rem; }
    .user-modal-btns button {
      flex: 1;
      padding: 0.75rem;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
      border: none;
      text-transform: uppercase;
      font-size: 0.85rem;
    }
    .btn-modal-cancel { background: #21262d; color: #c9d1d9; }
    .btn-modal-submit { background: var(--green, #238636); color: #fff; }

    .empty-state { text-align: center; padding: 4rem 1rem; color: var(--muted); }
  </style>
</head>
<body>

  <header>
    <div class="brand">ФК ГазМяс — Портал</div>
    <div class="nav-actions">
      <button class="btn-action btn-idea" onclick="openIdeaModal()">💡 Предложить идею</button>
      <button class="btn-action btn-sugar" onclick="filterSugarRush()">🍭 Sugar Rush</button>
    </div>
  </header>

  <div class="search-panel">
    <input type="text" id="searchInput" class="search-input" placeholder="Поиск по заголовку, фамилии, панчлайну..." oninput="handleSearch()">
    <input type="text" id="tagFilterInput" class="search-input" style="max-width: 280px;" placeholder="Фильтр по тегу (Основа, Дибуны...)" oninput="handleSearch()">
  </div>

  <main>
    <div id="squadGrid" class="squad-grid"></div>
    <div id="emptySquad" class="empty-state" style="display: none;">Ничего не найдено</div>
  </main>

  <!-- Модалка: Предложить новую идею -->
  <div class="user-modal-overlay" id="ideaModal">
    <div class="user-modal">
      <h3>Предложить кадр или мем</h3>
      <div class="form-group">
        <label>Ваш позывной / Ник</label>
        <input type="text" id="ideaAuthor" placeholder="Например: Гоша из 666">
      </div>
      <div class="form-group">
        <label>Заголовок кадра</label>
        <input type="text" id="ideaTitle" placeholder="Короткий заголовок...">
      </div>
      <div class="form-group">
        <label>Панчлайн / История</label>
        <textarea id="ideaCaption" placeholder="Опишите момент или цитату..."></textarea>
      </div>
      <div class="form-group">
        <label>Ссылка на картинку (URL)</label>
        <input type="text" id="ideaImgUrl" placeholder="https://... (необязательно)">
      </div>
      <div class="user-modal-btns">
        <button class="btn-modal-cancel" onclick="closeIdeaModal()">Отмена</button>
        <button class="btn-modal-submit" style="background: #10b981;" onclick="submitNewIdea()">Отправить в штаб</button>
      </div>
    </div>
  </div>

  <!-- Модалка: Предложить правку -->
  <div class="user-modal-overlay" id="editModal">
    <div class="user-modal">
      <h3>Предложить правку для кадра</h3>
      <div class="form-group">
        <label>Новый заголовок</label>
        <input type="text" id="editTitle">
      </div>
      <div class="form-group">
        <label>Новое описание / панчлайн</label>
        <textarea id="editCaption"></textarea>
      </div>
      <div class="user-modal-btns">
        <button class="btn-modal-cancel" onclick="closeEditModal()">Отмена</button>
        <button class="btn-modal-submit" onclick="submitEditRequest()">Отправить правку</button>
      </div>
    </div>
  </div>

  <script>
    // ВСТАВЬ СВОИ ДАННЫЕ ОТ JSONBIN.IO
    const JSONBIN_BIN_ID = "6abbe438ffd5d160533c11f1";
    const JSONBIN_MASTER_KEY = "$2a$10$VRoPiN8zdepg2AgC69BLZudokIxDgyL3LmDVPcv5HlHKRAalpZ5Vq";

    let squadData = [];
    let currentEditIndex = -1;

    async function loadSquad() {
      try {
        const res = await fetch("data.json?t=" + Date.now());
        if (!res.ok) throw new Error("HTTP " + res.status);
        squadData = await res.json();
        renderSquad(squadData);
      } catch (err) {
        document.getElementById("emptySquad").style.display = "block";
        document.getElementById("emptySquad").textContent = "Состав не загружен (запустите через локальный веб-сервер или проверьте data.json).";
      }
    }

    function renderSquad(items) {
      const grid = document.getElementById("squadGrid");
      const empty = document.getElementById("emptySquad");

      if (!items || items.length === 0) {
        grid.innerHTML = "";
        empty.style.display = "block";
        return;
      }

      empty.style.display = "none";
      grid.innerHTML = "";

      items.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "player-card";
        card.innerHTML = `
          <div class="card-photo-wrap">
            <img src="${item.file}" alt="${escapeHtml(item.title)}" loading="lazy">
            <div class="tag-badge ${item.tag_class || ''}">${escapeHtml(item.tag || 'Основа')}</div>
          </div>
          <div class="card-body">
            <div class="card-title">${escapeHtml(item.title)}</div>
            <div class="card-caption">${escapeHtml(item.caption)}</div>
          </div>
          <div class="card-user-actions">
            <button class="btn-card-action edit" onclick="openEditModal(${index})">✎ Правка</button>
            <button class="btn-card-action del" onclick="requestDelete(${index})">✕ Удалить</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function handleSearch() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      const tagQ = document.getElementById("tagFilterInput").value.toLowerCase().trim();

      const filtered = squadData.filter(item => {
        const matchText = (item.title || "").toLowerCase().includes(q) || (item.caption || "").toLowerCase().includes(q);
        const matchTag = tagQ === "" || (item.tag || "").toLowerCase().includes(tagQ);
        return matchText && matchTag;
      });

      renderSquad(filtered);
    }

    function filterSugarRush() {
      document.getElementById("searchInput").value = "Sugar Rush";
      handleSearch();
    }

    // Запись в облачный буфер JSONBin
    async function pushToCloudQueue(newItem) {
      let currentItems = [];
      try {
        const getRes = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { "X-Master-Key": JSONBIN_MASTER_KEY }
        });
        if (getRes.ok) {
          const data = await getRes.json();
          if (Array.isArray(data.record)) {
            currentItems = data.record;
          } else if (data.record && Array.isArray(data.record.queue)) {
            currentItems = data.record.queue;
          }
        }
      } catch (e) {
        currentItems = [];
      }

      currentItems = currentItems.filter(item => !item.init);
      currentItems.unshift(newItem);

      const putRes = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": JSONBIN_MASTER_KEY
        },
        body: JSON.stringify({ queue: currentItems })
      });

      if (!putRes.ok) throw new Error("Cloud write failed");
    }

    function openIdeaModal() {
      document.getElementById("ideaModal").style.display = "flex";
    }
    function closeIdeaModal() {
      document.getElementById("ideaModal").style.display = "none";
    }

    async function submitNewIdea() {
      const author = document.getElementById("ideaAuthor").value.trim();
      const title = document.getElementById("ideaTitle").value.trim();
      const caption = document.getElementById("ideaCaption").value.trim();
      const imageUrl = document.getElementById("ideaImgUrl").value.trim();

      if (!title || !caption) {
        alert("Заполните заголовок и описание!");
        return;
      }

      const ideaItem = {
        id: "idea_" + Date.now(),
        time: new Date().toLocaleString("ru-RU"),
        type: "idea",
        author: author || "Болельщик",
        title: title,
        caption: caption,
        image_url: imageUrl || "images/placeholder.jpg",
        tag: "Предложка"
      };

      try {
        await pushToCloudQueue(ideaItem);
        alert("Идея успешно отправлена в штаб модерации ГазМяса!");
        document.getElementById("ideaTitle").value = "";
        document.getElementById("ideaCaption").value = "";
        document.getElementById("ideaImgUrl").value = "";
        closeIdeaModal();
      } catch (e) {
        alert("Сбой связи с облачным штабом. Попробуйте позже.");
      }
    }

    function openEditModal(index) {
      currentEditIndex = index;
      const item = squadData[index];
      document.getElementById("editTitle").value = item.title;
      document.getElementById("editCaption").value = item.caption;
      document.getElementById("editModal").style.display = "flex";
    }
    function closeEditModal() {
      document.getElementById("editModal").style.display = "none";
      currentEditIndex = -1;
    }

    async function submitEditRequest() {
      if (currentEditIndex < 0) return;
      const item = squadData[currentEditIndex];
      const newTitle = document.getElementById("editTitle").value.trim();
      const newCaption = document.getElementById("editCaption").value.trim();

      if (!newTitle) {
        alert("Укажите заголовок!");
        return;
      }

      const reqItem = {
        id: "req_" + Date.now(),
        time: new Date().toLocaleString("ru-RU"),
        file: item.file,
        type: "edit",
        current_title: item.title,
        current_caption: item.caption,
        new_title: newTitle,
        new_caption: newCaption
      };

      try {
        await pushToCloudQueue(reqItem);
        alert("Правка отправлена дирекции клуба!");
        closeEditModal();
      } catch (e) {
        alert("Сбой связи с облаком.");
      }
    }

    async function requestDelete(index) {
      const item = squadData[index];
      if (!confirm(`Отправить заявку на удаление кадра "${item.title}"?`)) return;

      const reqItem = {
        id: "req_" + Date.now(),
        time: new Date().toLocaleString("ru-RU"),
        file: item.file,
        type: "delete",
        current_title: item.title,
        current_caption: item.caption
      };

      try {
        await pushToCloudQueue(reqItem);
        alert("Заявка на удаление отправлена модераторам!");
      } catch (e) {
        alert("Сбой отправки заявки.");
      }
    }

    function escapeHtml(str) {
      return (str || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    loadSquad();
  </script>
</body>
</html>
