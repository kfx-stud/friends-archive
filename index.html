<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ФК «ГазМяс» – Официальный вестник и архив</title>
  <link rel="icon" type="image/png" href="symbol.png">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: #141721;
      --border: #232838;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-red: #ef4444;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0f121d;
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand img {
      width: 32px;
      height: 32px;
    }

    .nav-links {
      display: flex;
      gap: 16px;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }

    .nav-btn:hover {
      background: var(--card-bg);
      border-color: var(--accent);
    }

    main {
      flex: 1;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 20px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Статьи */
    .articles-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 48px;
    }

    .article-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .article-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 12px;
    }

    .article-tag {
      background: rgba(59, 130, 246, 0.15);
      color: var(--accent);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
    }

    .article-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .article-content {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    /* Галерея карточек */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .media-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
    }

    .media-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .media-thumb-box {
      width: 100%;
      height: 220px;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .media-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .media-badges {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .badge-score {
      background: rgba(0, 0, 0, 0.8);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge-tag {
      background: rgba(0, 0, 0, 0.8);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }

    .media-info {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .media-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .media-caption {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Модальное окно просмотра */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      display: flex;
      width: 100%;
      max-width: 1150px;
      height: 85vh;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .modal-photo-col {
      flex: 2;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .modal-photo-col img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .modal-sidebar-col {
      flex: 1;
      min-width: 320px;
      max-width: 400px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-left: 1px solid var(--border);
      background: #11141e;
    }

    .btn-action {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    .btn-action:hover { opacity: 0.9; }

    /* Слот Sugar Rush */
    #slot-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .slot-container {
      background: #1e1338;
      border: 2px solid #a855f7;
      border-radius: 12px;
      padding: 20px;
      width: 95%;
      max-width: 620px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #fff;
    }

    .slot-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      background: #110926;
      padding: 8px;
      border-radius: 8px;
      width: 100%;
      aspect-ratio: 1/1;
      max-width: 480px;
      margin: 12px 0;
    }

    .slot-cell {
      background: #2b1854;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      position: relative;
      user-select: none;
    }

    .cell-mult {
      position: absolute;
      top: 2px;
      right: 2px;
      background: #ef4444;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="symbol.png" alt="Герб">
      <span>ФК «ГазМяс»</span>
    </div>
    <div class="nav-links">
      <button class="nav-btn" onclick="openSlot()">🍭 Sugar Rush 7x7</button>
      <button class="nav-btn" onclick="openSuggestModal()">➕ В предложку</button>
    </div>
  </header>

  <main>
    <!-- Вестник -->
    <div id="articles-section" style="display: none;">
      <div class="section-title">📰 Вестник Клуба</div>
      <div id="articles-list" class="articles-grid"></div>
    </div>

    <!-- Галерея -->
    <div class="section-title">📸 Основной состав</div>
    <div id="gallery" class="gallery-grid"></div>
  </main>

  <!-- Модальное окно просмотра карточки -->
  <div id="card-modal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-photo-col">
        <img id="modal-img" src="" alt="Full photo">
      </div>
      <div class="modal-sidebar-col">
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <span id="modal-tag" class="badge-tag"></span>
            <span id="modal-score" class="badge-score"></span>
          </div>
          <h2 id="modal-title" style="margin-bottom: 12px; font-size: 20px;"></h2>
          <p id="modal-caption" style="color: var(--text-muted); font-size: 14px; line-height: 1.5; white-space: pre-wrap;"></p>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
          <button class="btn-action" style="background: var(--accent); color: #fff;" onclick="requestEdit()">✏️ Править описание</button>
          <button class="btn-action" style="background: var(--accent-red); color: #fff;" onclick="requestDelete()">🗑️ Запрос на удаление</button>
          <button class="btn-action" style="background: var(--border); color: #fff;" onclick="closeModal()">Закрыть</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Модальное окно предложки -->
  <div id="suggest-modal" class="modal-backdrop">
    <div style="background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 24px; width: 100%; max-width: 480px;">
      <h3 style="margin-bottom: 16px;">Предложить фото или новость</h3>
      <input type="text" id="sug-title" placeholder="Заголовок..." style="width: 100%; padding: 10px; background: #0f121d; border: 1px solid var(--border); color: #fff; border-radius: 6px; margin-bottom: 12px;">
      <textarea id="sug-text" rows="4" placeholder="Описание / контекст / ссылка на фото..." style="width: 100%; padding: 10px; background: #0f121d; border: 1px solid var(--border); color: #fff; border-radius: 6px; margin-bottom: 16px;"></textarea>
      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button class="nav-btn" onclick="closeSuggestModal()">Отмена</button>
        <button class="btn-action" style="background: var(--accent-green); color: #fff; width: auto; padding: 10px 20px;" onclick="sendSuggest()">Отправить</button>
      </div>
    </div>
  </div>

  <!-- Слот Sugar Rush -->
  <div id="slot-modal">
    <div class="slot-container">
      <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
        <h3 style="color: #f472b6;">🍭 Sugar Rush 7x7</h3>
        <button class="nav-btn" onclick="closeSlot()">✕</button>
      </div>
      <div style="display: flex; gap: 24px; margin-top: 10px; font-weight: 700;">
        <div>Баланс: <span id="slot-balance" style="color: #4ade80;">1000</span></div>
        <div>Выигрыш: <span id="slot-win" style="color: #facc15;">0</span></div>
      </div>

      <div id="slot-board" class="slot-grid"></div>

      <div style="display: flex; gap: 10px; width: 100%; justify-content: center;">
        <button id="btn-spin" class="btn-action" style="background: #ec4899; color: #fff; max-width: 160px;" onclick="spin()">КРУТИТЬ (20)</button>
        <button id="btn-buy" class="btn-action" style="background: #8b5cf6; color: #fff; max-width: 180px;" onclick="buyBonus()">BUY BONUS (2000)</button>
      </div>
    </div>
  </div>

  <script>
    // Конфигурация буфера JSONBin
    const JSONBIN_BIN_ID = "6abbe438ffd5c4501258671d";
    const JSONBIN_ACCESS_KEY = "$2a$10$VKrFmEhyEw6K8uXv1s3ZCeXqA4M/XzI1G8Xy7M7J0J.hH7c6Tq8O.";

    let activeCard = null;
    let cardsData = [];

    async function loadData() {
      try {
        const res = await fetch('data/data.json');
        cardsData = await res.json();
        renderGallery(cardsData);
      } catch (e) {
        console.error("Ошибка загрузки data.json", e);
      }

      try {
        const res = await fetch('data/articles.json');
        const articles = await res.json();
        if (articles && articles.length > 0) {
          renderArticles(articles);
        }
      } catch (e) {}
    }

    function renderArticles(articles) {
      document.getElementById('articles-section').style.display = 'block';
      const container = document.getElementById('articles-list');
      container.innerHTML = articles.map(a => `
        <div class="article-card">
          <div>
            <div class="article-header">
              <span class="article-tag">${a.tag}</span>
              <span style="color: var(--text-muted);">${a.date}</span>
            </div>
            <div class="article-title">${a.title}</div>
            <div class="article-content">${a.content}</div>
          </div>
          <div style="margin-top: 12px; font-size: 12px; color: var(--text-muted);">Автор: ${a.author}</div>
        </div>
      `).join('');
    }

    function renderGallery(cards) {
      const container = document.getElementById('gallery');
      container.innerHTML = cards.map(c => `
        <div class="media-card" onclick="openModal('${c.filename}')">
          <div class="media-thumb-box">
            <img src="images/${c.filename}" loading="lazy" style="object-position: ${c.crop_x ?? 50}% ${c.crop_y ?? 50}%;">
            <div class="media-badges">
              <span class="badge-score">${c.score ?? 5}/10</span>
              <span class="badge-tag">${c.tag ?? 'ФОТО'}</span>
            </div>
          </div>
          <div class="media-info">
            <div class="media-title">${c.title || 'Без названия'}</div>
            <div class="media-caption">${c.caption || ''}</div>
          </div>
        </div>
      `).join('');
    }

    function openModal(filename) {
      activeCard = cardsData.find(c => c.filename === filename);
      if (!activeCard) return;

      document.getElementById('modal-img').src = 'images/' + activeCard.filename;
      document.getElementById('modal-title').innerText = activeCard.title || '';
      document.getElementById('modal-caption').innerText = activeCard.caption || '';
      document.getElementById('modal-tag').innerText = activeCard.tag || 'ФОТО';
      document.getElementById('modal-score').innerText = (activeCard.score ? activeCard.score + '/10' : '');

      document.getElementById('card-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('card-modal').style.display = 'none';
      activeCard = null;
    }

    async function sendToCloudBuffer(payload) {
      try {
        const getRes = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
          headers: { 'X-Access-Key': JSONBIN_ACCESS_KEY }
        });
        const json = await getRes.json();
        let queue = json.record?.queue || [];

        queue.push({
          id: 'req_' + Date.now(),
          timestamp: new Date().toISOString(),
          ...payload
        });

        await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Access-Key': JSONBIN_ACCESS_KEY
          },
          body: JSON.stringify({ queue })
        });
        return true;
      } catch (err) {
        console.error("Ошибка буфера JSONBin:", err);
        return false;
      }
    }

    async function requestEdit() {
      if (!activeCard) return;
      const newTitle = prompt('Новый заголовок:', activeCard.title);
      if (newTitle === null) return;
      const newCaption = prompt('Новое описание:', activeCard.caption);
      if (newCaption === null) return;

      const ok = await sendToCloudBuffer({
        type: 'edit',
        filename: activeCard.filename,
        title: newTitle,
        caption: newCaption,
        current_crop_x: activeCard.crop_x ?? 50,
        current_crop_y: activeCard.crop_y ?? 50
      });

      if (ok) alert('Заявка на правку отправлена модераторам!');
      closeModal();
    }

    async function requestDelete() {
      if (!activeCard) return;
      if (!confirm('Отправить запрос на удаление этой карточки?')) return;

      const ok = await sendToCloudBuffer({
        type: 'delete',
        filename: activeCard.filename,
        title: activeCard.title
      });

      if (ok) alert('Запрос на удаление отправлен!');
      closeModal();
    }

    function openSuggestModal() {
      document.getElementById('suggest-modal').style.display = 'flex';
    }

    function closeSuggestModal() {
      document.getElementById('suggest-modal').style.display = 'none';
    }

    async function sendSuggest() {
      const title = document.getElementById('sug-title').value.trim();
      const text = document.getElementById('sug-text').value.trim();
      if (!title || !text) return alert('Заполните поля');

      const ok = await sendToCloudBuffer({
        type: 'suggest',
        title: title,
        caption: text
      });

      if (ok) {
        alert('Заявка отправлена в штаб!');
        document.getElementById('sug-title').value = '';
        document.getElementById('sug-text').value = '';
        closeSuggestModal();
      }
    }

    // --- СЛОТ SUGAR RUSH 7x7 ---
    const ICONS = ['🍬', '🍭', '🍇', '🍉', '⭐', '🐻', '🚀'];
    let grid = Array(49).fill('');
    let spots = Array(49).fill(0);
    let balance = 1000;
    let isSpinning = false;

    function openSlot() { document.getElementById('slot-modal').style.display = 'flex'; initBoard(); }
    function closeSlot() { document.getElementById('slot-modal').style.display = 'none'; }

    function initBoard() {
      const b = document.getElementById('slot-board');
      b.innerHTML = '';
      for (let i = 0; i < 49; i++) {
        grid[i] = ICONS[Math.floor(Math.random() * 6)];
        const cell = document.createElement('div');
        cell.className = 'slot-cell';
        cell.id = 'cell-' + i;
        cell.innerText = grid[i];
        b.appendChild(cell);
      }
    }

    function renderBoard() {
      for (let i = 0; i < 49; i++) {
        const c = document.getElementById('cell-' + i);
        c.innerText = grid[i];
        const oldMult = c.querySelector('.cell-mult');
        if (oldMult) oldMult.remove();
        if (spots[i] > 1) {
          const m = document.createElement('span');
          m.className = 'cell-mult';
          m.innerText = 'x' + spots[i];
          c.appendChild(m);
        }
      }
    }

    async function spin() {
      if (isSpinning || balance < 20) return;
      isSpinning = true;
      balance -= 20;
      document.getElementById('slot-balance').innerText = balance;
      document.getElementById('slot-win').innerText = 0;

      for (let i = 0; i < 49; i++) grid[i] = ICONS[Math.floor(Math.random() * 6)];
      renderBoard();
      await processClusters();
      isSpinning = false;
    }

    async function buyBonus() {
      if (isSpinning || balance < 2000) return;
      balance -= 2000;
      document.getElementById('slot-balance').innerText = balance;
      alert('Бонусный раунд запущен! Множители спотов зафиксированы.');
      await spin();
    }

    function getCluster(startIndex, visited) {
      const sym = grid[startIndex];
      if (!sym || sym === '🚀') return [];
      const cluster = [];
      const queue = [startIndex];
      visited[startIndex] = true;

      while (queue.length) {
        const idx = queue.shift();
        cluster.push(idx);
        const r = Math.floor(idx / 7);
        const c = idx % 7;
        const neighbors = [];
        if (r > 0) neighbors.push(idx - 7);
        if (r < 6) neighbors.push(idx + 7);
        if (c > 0) neighbors.push(idx - 1);
        if (c < 6) neighbors.push(idx + 1);

        for (const n of neighbors) {
          if (!visited[n] && grid[n] === sym) {
            visited[n] = true;
            queue.push(n);
          }
        }
      }
      return cluster;
    }

    async function processClusters() {
      let winRound = 0;
      let hasWin = true;

      while (hasWin) {
        hasWin = false;
        const visited = Array(49).fill(false);
        const toExplode = new Set();

        for (let i = 0; i < 49; i++) {
          if (!visited[i]) {
            const cluster = getCluster(i, visited);
            if (cluster.length >= 5) {
              hasWin = true;
              cluster.forEach(idx => toExplode.add(idx));
              let multSum = 0;
              cluster.forEach(idx => {
                multSum += (spots[idx] > 1 ? spots[idx] : 1);
              });
              winRound += cluster.length * 4 * multSum;
            }
          }
        }

        if (hasWin) {
          toExplode.forEach(idx => {
            spots[idx] = spots[idx] === 0 ? 2 : Math.min(128, spots[idx] * 2);
            grid[idx] = '';
          });
          renderBoard();
          await new Promise(r => setTimeout(r, 400));

          // Падение символов (Tumble)
          for (let col = 0; col < 7; col++) {
            let emptyRow = 6;
            for (let row = 6; row >= 0; row--) {
              const idx = row * 7 + col;
              if (grid[idx] !== '') {
                grid[emptyRow * 7 + col] = grid[idx];
                if (emptyRow !== row) grid[idx] = '';
                emptyRow--;
              }
            }
            while (emptyRow >= 0) {
              grid[emptyRow * 7 + col] = ICONS[Math.floor(Math.random() * 6)];
              emptyRow--;
            }
          }
          renderBoard();
          await new Promise(r => setTimeout(r, 300));
        }
      }

      balance += winRound;
      document.getElementById('slot-win').innerText = winRound;
      document.getElementById('slot-balance').innerText = balance;
    }

    loadData();
  </script>
</body>
</html>
