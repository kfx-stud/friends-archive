<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Штаб Модерации – ФК ГазМяс</title>
  <style>
    :root {
      --bg-dark: #0f1117;
      --bg-card: #181b23;
      --bg-input: #232733;
      --border-color: #2c3242;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-yellow: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
    }

    .tab-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      background: var(--bg-input);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      color: #fff;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-img-container {
      width: 100%;
      height: 220px;
      position: relative;
      background: #000;
      overflow: hidden;
    }

    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-badges {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .badge-score {
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--accent-yellow);
      color: var(--accent-yellow);
      font-weight: 700;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .badge-tag {
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      font-weight: 700;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .card-content {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #fff;
    }

    .card-caption {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 16px;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-green {
      background: var(--accent-green);
      color: #fff;
    }

    .btn-green:hover { background: #059669; }

    .btn-red {
      background: var(--accent-red);
      color: #fff;
    }

    .btn-red:hover { background: #dc2626; }

    .btn-blue {
      background: var(--accent-blue);
      color: #fff;
    }

    .btn-blue:hover { background: #2563eb; }

    .btn-gray {
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    .btn-gray:hover { background: #2f3444; }

    /* Модальное окно кадрирования */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-window {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      width: 100%;
      max-width: 900px;
      padding: 24px;
      color: var(--text-main);
    }

    .crop-layout {
      display: flex;
      gap: 20px;
      margin: 16px 0;
    }

    .crop-picker-wrapper {
      position: relative;
      flex: 2;
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      cursor: crosshair;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .crop-picker-wrapper img {
      width: 100%;
      height: auto;
      max-height: 400px;
      object-fit: contain;
      user-select: none;
      display: block;
    }

    .crop-point-target {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid var(--accent-red);
      background: rgba(239, 68, 68, 0.3);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .crop-preview-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .preview-frame {
      width: 200px;
      height: 160px;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid var(--accent-blue);
      background: #000;
    }

    .preview-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent-blue);
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Штаб Модерации ФК «ГазМяс»</h1>
      <p style="color: var(--text-muted); font-size: 13px; margin-top: 4px;">Управление очередью конвейера, предложкой и статьями</p>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('pending')">Очередь (<span id="count-pending">0</span>)</button>
      <button class="tab-btn" onclick="switchTab('requests')">Заявки и Правки (<span id="count-requests">0</span>)</button>
      <button class="tab-btn" onclick="switchTab('articles')">📰 Статьи (<span id="count-articles">0</span>)</button>
      <button class="tab-btn" onclick="switchTab('approved')">Опубликовано (<span id="count-approved">0</span>)</button>
    </div>
  </header>

  <!-- ВКЛАДКА 1: ОЧЕРЕДЬ КУРИРОВАНИЯ -->
  <section id="tab-pending">
    <div id="pending-list" class="grid-container"></div>
  </section>

  <!-- ВКЛАДКА 2: ЗАЯВКИ С САЙТА -->
  <section id="tab-requests" style="display: none;">
    <div id="requests-list" style="display: flex; flex-direction: column; gap: 12px;"></div>
  </section>

  <!-- ВКЛАДКА 3: СТАТЬИ ВЕСТНИКА -->
  <section id="tab-articles" style="display: none;">
    <div style="background: var(--bg-card); border: 1px solid var(--border-color); padding: 20px; border-radius: 8px; margin-bottom: 24px; max-width: 800px;">
      <h3 id="article-form-header" style="margin-bottom: 16px;">Добавить новую статью</h3>
      <input type="hidden" id="art-id">
      
      <div class="form-group">
        <label>Заголовок статьи:</label>
        <input type="text" id="art-title" class="form-control" placeholder="Заголовок...">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;" class="form-group">
        <div>
          <label>Тег рубрики:</label>
          <input type="text" id="art-tag" class="form-control" value="ВЕСТНИК">
        </div>
        <div>
          <label>Автор:</label>
          <input type="text" id="art-author" class="form-control" value="Редакция">
        </div>
      </div>

      <div class="form-group">
        <label>Текст статьи:</label>
        <textarea id="art-content" rows="6" class="form-control" placeholder="Текст материала..."></textarea>
      </div>

      <div style="display: flex; gap: 10px;">
        <button class="btn btn-green" onclick="saveArticle()">Сохранить статью</button>
        <button class="btn btn-gray" onclick="resetArticleForm()">Сбросить форму</button>
      </div>
    </div>

    <div id="articles-container" style="display: flex; flex-direction: column; gap: 12px; max-width: 800px;"></div>
  </section>

  <!-- ВКЛАДКА 4: ОПУБЛИКОВАННЫЕ КАРТОЧКИ -->
  <section id="tab-approved" style="display: none;">
    <div id="approved-list" class="grid-container"></div>
  </section>

  <!-- МОДАЛЬНОЕ ОКНО КАДРИРОВАНИЯ И ПРАВКИ -->
  <div id="crop-modal" class="modal-backdrop">
    <div class="modal-window">
      <h3 style="margin-bottom: 6px;">Редактирование отображаемой части и метаданных</h3>
      <p style="font-size: 13px; color: var(--text-muted);">Кликните по фотографии в поле фокуса для позиционирования витрины:</p>

      <div class="crop-layout">
        <div id="crop-picker" class="crop-picker-wrapper">
          <img id="crop-src-img" src="" alt="Crop Source">
          <div id="crop-marker" class="crop-point-target"></div>
        </div>

        <div class="crop-preview-box">
          <span style="font-size: 12px; margin-bottom: 8px; color: var(--text-muted);">Превью витрины:</span>
          <div class="preview-frame">
            <img id="crop-preview-img" src="" alt="Preview">
          </div>
          <div style="margin-top: 12px; font-family: monospace; font-size: 12px; color: var(--text-muted);">
            X: <span id="lbl-crop-x">50</span>% | Y: <span id="lbl-crop-y">50</span>%
          </div>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-group">
          <label>Заголовок:</label>
          <input type="text" id="modal-field-title" class="form-control">
        </div>
        <div class="form-group">
          <label>Тег:</label>
          <input type="text" id="modal-field-tag" class="form-control">
        </div>
      </div>

      <div class="form-group">
        <label>Описание / Панчлайн:</label>
        <textarea id="modal-field-caption" rows="3" class="form-control"></textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px;">
        <button class="btn btn-gray" onclick="closeCropModal()">Отмена</button>
        <button id="modal-btn-confirm" class="btn btn-green">Применить</button>
      </div>
    </div>
  </div>

  <script>
    let pendingData = [];
    let requestsData = [];
    let articlesData = [];
    let approvedData = [];

    let currentModalTarget = null;
    let currentModalMode = 'approve';
    let cropPoint = { x: 50, y: 50 };

    async function init() {
      await Promise.all([loadPending(), loadRequests(), loadArticles(), loadApproved()]);
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      ['pending', 'requests', 'articles', 'approved'].forEach(id => {
        document.getElementById(`tab-${id}`).style.display = (id === tabId) ? 'block' : 'none';
      });
    }

    // --- ОЧЕРЕДЬ ---
    async function loadPending() {
      const res = await fetch('/api/pending');
      pendingData = await res.json();
      document.getElementById('count-pending').innerText = pendingData.length;
      renderPending();
    }

    function renderPending() {
      const box = document.getElementById('pending-list');
      if (!pendingData.length) {
        box.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">Очередь чиста. Все кадры обработаны.</p>';
        return;
      }

      box.innerHTML = pendingData.map(item => `
        <div class="card">
          <div class="card-img-container">
            <img src="pending/${item.filename}" style="object-position: ${item.crop_x ?? 50}% ${item.crop_y ?? 50}%">
            <div class="card-badges">
              <span class="badge-score">${item.score ?? 5}/10</span>
              <span class="badge-tag">${item.tag ?? 'КАДР'}</span>
            </div>
          </div>
          <div class="card-content">
            <div>
              <div class="card-title">${item.title ?? 'Без названия'}</div>
              <div class="card-caption">${item.caption ?? ''}</div>
            </div>
            <div class="card-actions">
              <button class="btn btn-red" onclick="rejectItem('${item.filename}')">✖ Брак [D]</button>
              <button class="btn btn-green" onclick="openApproveModal('${item.filename}')">✔ На сайт [A]</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function rejectItem(filename) {
      const res = await fetch('/api/reject', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename })
      });
      if (res.ok) await loadPending();
    }

    // --- ЗАЯВКИ И ПРАВКИ ---
    async function loadRequests() {
      const res = await fetch('/api/requests');
      requestsData = await res.json();
      document.getElementById('count-requests').innerText = requestsData.length;
      renderRequests();
    }

    function renderRequests() {
      const box = document.getElementById('requests-list');
      if (!requestsData.length) {
        box.innerHTML = '<p style="color: var(--text-muted);">Новых пользовательских заявок нет.</p>';
        return;
      }

      box.innerHTML = requestsData.map(r => `
        <div style="background: var(--bg-card); border: 1px solid var(--border-color); padding: 16px; border-radius: 8px; display: flex; gap: 16px; align-items: center;">
          <img src="images/${r.filename}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 6px; background: #000;">
          <div style="flex: 1;">
            <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 4px;">
              <span class="badge-tag">${r.type === 'delete' ? 'ЗАПРОС НА УДАЛЕНИЕ' : 'ЗАЯВКА НА ПРАВКУ'}</span>
              <span style="font-size: 12px; color: var(--text-muted);">${r.filename}</span>
            </div>
            <div style="font-weight: 700; margin-bottom: 4px;">${r.title || ''}</div>
            <div style="font-size: 13px; color: var(--text-muted);">${r.caption || ''}</div>
          </div>
          <div style="display: flex; gap: 8px;">
            ${r.type === 'delete' 
              ? `<button class="btn btn-red" onclick="executeDeleteCard('${r.filename}', '${r.id}')">Удалить с сайта</button>` 
              : `<button class="btn btn-blue" onclick="openEditModal('${r.filename}', '${r.id}')">Принять и настроить</button>`}
            <button class="btn btn-gray" onclick="resolveRequest('${r.id}')">Отклонить</button>
          </div>
        </div>
      `).join('');
    }

    async function executeDeleteCard(filename, requestId) {
      if (!confirm(`Подтверждаете удаление карточки ${filename} из архива?`)) return;
      const res = await fetch('/api/delete-card', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename, request_id: requestId })
      });
      if (res.ok) {
        await Promise.all([loadRequests(), loadApproved()]);
      }
    }

    async function resolveRequest(id) {
      const res = await fetch('/api/resolve-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      if (res.ok) await loadRequests();
    }

    // --- ОПУБЛИКОВАННОЕ ---
    async function loadApproved() {
      const res = await fetch('/api/data');
      approvedData = await res.json();
      document.getElementById('count-approved').innerText = approvedData.length;
      renderApproved();
    }

    function renderApproved() {
      const box = document.getElementById('approved-list');
      if (!approvedData.length) {
        box.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">Опубликованных карточек пока нет.</p>';
        return;
      }

      box.innerHTML = approvedData.map(item => `
        <div class="card">
          <div class="card-img-container">
            <img src="images/${item.filename}" style="object-position: ${item.crop_x ?? 50}% ${item.crop_y ?? 50}%">
            <div class="card-badges">
              <span class="badge-tag">${item.tag ?? 'КАДР'}</span>
            </div>
          </div>
          <div class="card-content">
            <div>
              <div class="card-title">${item.title ?? ''}</div>
              <div class="card-caption">${item.caption ?? ''}</div>
            </div>
            <div class="card-actions">
              <button class="btn btn-red" onclick="executeDeleteCard('${item.filename}', null)">Удалить</button>
              <button class="btn btn-blue" onclick="openEditModal('${item.filename}', null)">Править фокус</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // --- СТАТЬИ ---
    async function loadArticles() {
      const res = await fetch('/api/articles');
      articlesData = await res.json();
      document.getElementById('count-articles').innerText = articlesData.length;
      renderArticles();
    }

    function renderArticles() {
      const box = document.getElementById('articles-container');
      if (!articlesData.length) {
        box.innerHTML = '<p style="color: var(--text-muted);">Статей пока нет.</p>';
        return;
      }

      box.innerHTML = articlesData.map(art => `
        <div style="background: var(--bg-card); border: 1px solid var(--border-color); padding: 16px; border-radius: 8px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span class="badge-tag">${art.tag}</span>
            <span style="font-size: 12px; color: var(--text-muted);">${art.date} | ${art.author}</span>
          </div>
          <h4 style="margin-bottom: 8px;">${art.title}</h4>
          <p style="color: var(--text-muted); font-size: 13px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 12px;">${art.content}</p>
          <div style="display: flex; gap: 8px;">
            <button class="btn btn-blue" onclick="editArticle('${art.id}')">Редактировать</button>
            <button class="btn btn-red" onclick="deleteArticle('${art.id}')">Удалить</button>
          </div>
        </div>
      `).join('');
    }

    function editArticle(id) {
      const art = articlesData.find(a => a.id === id);
      if (!art) return;
      document.getElementById('art-id').value = art.id;
      document.getElementById('art-title').value = art.title;
      document.getElementById('art-tag').value = art.tag;
      document.getElementById('art-author').value = art.author;
      document.getElementById('art-content').value = art.content;
      document.getElementById('article-form-header').innerText = 'Редактировать статью';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetArticleForm() {
      document.getElementById('art-id').value = '';
      document.getElementById('art-title').value = '';
      document.getElementById('art-tag').value = 'ВЕСТНИК';
      document.getElementById('art-author').value = 'Редакция';
      document.getElementById('art-content').value = '';
      document.getElementById('article-form-header').innerText = 'Добавить новую статью';
    }

    async function saveArticle() {
      const payload = {
        id: document.getElementById('art-id').value || null,
        title: document.getElementById('art-title').value,
        tag: document.getElementById('art-tag').value,
        author: document.getElementById('art-author').value,
        content: document.getElementById('art-content').value
      };

      const res = await fetch('/api/articles/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        resetArticleForm();
        await loadArticles();
      } else {
        alert('Ошибка при сохранении статьи');
      }
    }

    async function deleteArticle(id) {
      if (!confirm('Удалить эту статью?')) return;
      const res = await fetch('/api/articles/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      if (res.ok) await loadArticles();
    }

    // --- МОДАЛЬНОЕ ОКНО КАДРИРОВАНИЯ ---
    function openApproveModal(filename) {
      const item = pendingData.find(x => x.filename === filename);
      if (!item) return;

      currentModalMode = 'approve';
      currentModalTarget = item;
      setupCropModal(`pending/${filename}`, item);
    }

    function openEditModal(filename, requestId = null) {
      let item = approvedData.find(x => x.filename === filename);
      if (!item) {
        const req = requestsData.find(r => r.id === requestId);
        item = {
          filename: filename,
          title: req ? req.title : '',
          caption: req ? req.caption : '',
          tag: 'ОСНОВА',
          crop_x: req ? (req.current_crop_x ?? 50) : 50,
          crop_y: req ? (req.current_crop_y ?? 50) : 50
        };
      }

      currentModalMode = 'update';
      currentModalTarget = { ...item, request_id: requestId };
      setupCropModal(`images/${filename}`, currentModalTarget);
    }

    function setupCropModal(imageSrc, data) {
      cropPoint.x = data.crop_x ?? 50;
      cropPoint.y = data.crop_y ?? 50;

      const srcImg = document.getElementById('crop-src-img');
      const prevImg = document.getElementById('crop-preview-img');
      srcImg.src = imageSrc;
      prevImg.src = imageSrc;

      document.getElementById('modal-field-title').value = data.title || '';
      document.getElementById('modal-field-tag').value = data.tag || 'ФОТО';
      document.getElementById('modal-field-caption').value = data.caption || '';

      updateCropElements();
      document.getElementById('crop-modal').style.display = 'flex';

      document.getElementById('modal-btn-confirm').onclick = async () => {
        if (currentModalMode === 'approve') {
          await submitApprove();
        } else {
          await submitUpdate();
        }
      };
    }

    function closeCropModal() {
      document.getElementById('crop-modal').style.display = 'none';
      currentModalTarget = null;
    }

    function updateCropElements() {
      document.getElementById('crop-marker').style.left = `${cropPoint.x}%`;
      document.getElementById('crop-marker').style.top = `${cropPoint.y}%`;
      document.getElementById('lbl-crop-x').innerText = Math.round(cropPoint.x);
      document.getElementById('lbl-crop-y').innerText = Math.round(cropPoint.y);

      document.getElementById('crop-preview-img').style.objectPosition = `${cropPoint.x}% ${cropPoint.y}%`;
    }

    document.getElementById('crop-picker').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const x = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      const y = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));
      cropPoint.x = x;
      cropPoint.y = y;
      updateCropElements();
    });

    async function submitApprove() {
      const payload = {
        filename: currentModalTarget.filename,
        title: document.getElementById('modal-field-title').value,
        tag: document.getElementById('modal-field-tag').value,
        caption: document.getElementById('modal-field-caption').value,
        crop_x: Math.round(cropPoint.x),
        crop_y: Math.round(cropPoint.y)
      };

      const res = await fetch('/api/approve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        closeCropModal();
        await Promise.all([loadPending(), loadApproved()]);
      }
    }

    async function submitUpdate() {
      const payload = {
        filename: currentModalTarget.filename,
        title: document.getElementById('modal-field-title').value,
        tag: document.getElementById('modal-field-tag').value,
        caption: document.getElementById('modal-field-caption').value,
        crop_x: Math.round(cropPoint.x),
        crop_y: Math.round(cropPoint.y),
        request_id: currentModalTarget.request_id || null
      };

      const res = await fetch('/api/update-card', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        closeCropModal();
        await Promise.all([loadRequests(), loadApproved()]);
      }
    }

    // Хоткеи модерации
    window.addEventListener('keydown', (e) => {
      if (document.getElementById('crop-modal').style.display === 'flex') {
        if (e.key === 'Escape') closeCropModal();
        if (e.key === 'Enter') document.getElementById('modal-btn-confirm').click();
        return;
      }

      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (pendingData.length > 0) {
        const topItem = pendingData[0];
        if (e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') {
          openApproveModal(topItem.filename);
        } else if (e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') {
          rejectItem(topItem.filename);
        }
      }
    });

    init();
  </script>
</body>
</html>
