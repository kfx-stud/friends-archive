<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Штаб Модерации – ФК ГазМяс</title>
  <style>
    :root {
      --bg-dark: #0a0c10;
      --bg-card: #131722;
      --bg-card-hover: #191f2e;
      --bg-input: #1a202c;
      --border-color: #242c3d;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-blue: #3b82f6;
      --accent-yellow: #f59e0b;
      --accent-purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-info h1 {
      font-size: 24px;
      font-weight: 800;
    }

    .header-info p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
      background: #0f1219;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--accent-blue);
      color: #fff;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    /* Карточки */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      border-color: #3b82f666;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .card-img-container {
      width: 100%;
      height: 240px;
      position: relative;
      background: #050608;
      overflow: hidden;
    }

    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-badges {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .badge-score {
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--accent-yellow);
      color: var(--accent-yellow);
      font-weight: 800;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .badge-tag {
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      font-weight: 800;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .card-content {
      padding: 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #fff;
    }

    .card-caption {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 16px;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Кнопки */
    .btn {
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .btn-green { background: var(--accent-green); color: #fff; }
    .btn-red { background: var(--accent-red); color: #fff; }
    .btn-blue { background: var(--accent-blue); color: #fff; }
    .btn-gray { background: var(--bg-input); color: var(--text-main); border: 1px solid var(--border-color); }
    .btn-gray:hover { background: #232b3c; }

    /* Панель заявок */
    .request-row {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 18px;
      border-radius: 10px;
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .request-row.art-edit { border-left: 4px solid var(--accent-blue); }
    .request-row.art-new { border-left: 4px solid var(--accent-green); }
    .request-row.photo-new { border-left: 4px solid var(--accent-purple); }
    .request-row.del-req { border-left: 4px solid var(--accent-red); }

    /* Модальное окно кадрирования */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-window {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 900px;
      padding: 24px;
      color: var(--text-main);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .crop-layout {
      display: flex;
      gap: 20px;
      margin: 16px 0;
    }

    .crop-picker-wrapper {
      position: relative;
      flex: 2;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      cursor: crosshair;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-color);
    }

    .crop-picker-wrapper img {
      width: 100%;
      height: auto;
      max-height: 400px;
      object-fit: contain;
      user-select: none;
      display: block;
    }

    .crop-point-target {
      position: absolute;
      width: 20px;
      height: 20px;
      border: 2px solid var(--accent-red);
      background: rgba(239, 68, 68, 0.35);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .crop-preview-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .preview-frame {
      width: 240px;
      height: 190px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--accent-blue);
      background: #000;
    }

    .preview-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text-muted);
    }

    .form-control {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent-blue);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-info">
      <h1>Штаб Модерации ФК «ГазМяс»</h1>
      <p>Управление карточками, вестником и пользовательскими заявками</p>
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('pending')">Очередь (<span id="count-pending">0</span>)</button>
      <button class="tab-btn" onclick="switchTab('requests')">Заявки и Правки (<span id="count-requests">0</span>)</button>
      <button class="tab-btn" onclick="switchTab('articles')">📰 Статьи (<span id="count-articles">0</span>)</button>
      <button class="tab-btn" onclick="switchTab('approved')">На сайте (<span id="count-approved">0</span>)</button>
    </div>
  </header>

  <!-- ВКЛАДКА 1: ОЧЕРЕДЬ -->
  <section id="tab-pending">
    <div id="pending-list" class="grid-container"></div>
  </section>

  <!-- ВКЛАДКА 2: ЗАЯВКИ И ПРАВКИ -->
  <section id="tab-requests" style="display: none;">
    <div id="requests-list" style="display: flex; flex-direction: column; gap: 12px;"></div>
  </section>

  <!-- ВКЛАДКА 3: СТАТЬИ ВЕСТНИКА -->
  <section id="tab-articles" style="display: none;">
    <div style="background: var(--bg-card); border: 1px solid var(--border-color); padding: 22px; border-radius: 10px; margin-bottom: 24px; max-width: 850px;">
      <h3 id="article-form-header" style="margin-bottom: 16px;">Добавить новую статью</h3>
      <input type="hidden" id="art-id">
      
      <div class="form-group">
        <label>Заголовок статьи:</label>
        <input type="text" id="art-title" class="form-control" placeholder="Заголовок...">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;" class="form-group">
        <div>
          <label>Тег рубрики:</label>
          <input type="text" id="art-tag" class="form-control" value="ВЕСТНИК">
        </div>
        <div>
          <label>Автор:</label>
          <input type="text" id="art-author" class="form-control" value="Редакция">
        </div>
      </div>

      <div class="form-group">
        <label>Текст материала:</label>
        <textarea id="art-content" rows="6" class="form-control" placeholder="Текст статьи..."></textarea>
      </div>

      <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin: 14px 0;">
        <input type="checkbox" id="art-featured" style="width: 18px; height: 18px; cursor: pointer;">
        <label for="art-featured" style="margin: 0; cursor: pointer; color: #fff;">
          ★ Главный материал (растянуть на всю строку с золотым бейджем)
        </label>
      </div>

      <div style="display: flex; gap: 10px;">
        <button class="btn btn-green" onclick="saveArticle()">💾 Сохранить статью</button>
        <button class="btn btn-gray" onclick="resetArticleForm()">Сбросить форму</button>
      </div>
    </div>

    <div id="articles-container" style="display: flex; flex-direction: column; gap: 12px; max-width: 850px;"></div>
  </section>

  <!-- ВКЛАДКА 4: НА САЙТЕ -->
  <section id="tab-approved" style="display: none;">
    <div id="approved-list" class="grid-container"></div>
  </section>

  <!-- МОДАЛЬНОЕ ОКНО КАДРИРОВАНИЯ И ПРАВКИ -->
  <div id="crop-modal" class="modal-backdrop">
    <div class="modal-window">
      <h3 style="margin-bottom: 6px;">Настройка отображаемой области и описания</h3>
      <p style="font-size: 13px; color: var(--text-muted);">Кликните по фото, чтобы указать центр фокуса для сетки карточек:</p>

      <div class="crop-layout">
        <div id="crop-picker" class="crop-picker-wrapper">
          <img id="crop-src-img" src="" alt="Crop Source">
          <div id="crop-marker" class="crop-point-target"></div>
        </div>

        <div class="crop-preview-box">
          <span style="font-size: 12px; margin-bottom: 8px; color: var(--text-muted);">Превью витрины клуба:</span>
          <div class="preview-frame">
            <img id="crop-preview-img" src="" alt="Preview">
          </div>
          <div style="margin-top: 12px; font-family: monospace; font-size: 12px; color: var(--text-muted);">
            Фокус X: <span id="lbl-crop-x">50</span>% | Y: <span id="lbl-crop-y">50</span>%
          </div>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-group">
          <label>Заголовок:</label>
          <input type="text" id="modal-field-title" class="form-control">
        </div>
        <div class="form-group">
          <label>Тег:</label>
          <input type="text" id="modal-field-tag" class="form-control">
        </div>
      </div>

      <div class="form-group">
        <label>Описание / Панчлайн:</label>
        <textarea id="modal-field-caption" rows="3" class="form-control"></textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px;">
        <button class="btn btn-gray" onclick="closeCropModal()">Отмена</button>
        <button id="modal-btn-confirm" class="btn btn-green">Применить</button>
      </div>
    </div>
  </div>

  <script>
    let pendingData = [];
    let requestsData = [];
    let articlesData = [];
    let approvedData = [];

    let currentModalTarget = null;
    let currentModalMode = 'approve';
    let cropPoint = { x: 50, y: 50 };

    function resolveImagePath(item) {
      if (!item) return '';
      const raw = item.file || item.filename || '';
      if (!raw) return '';
      return raw.startsWith('images/') ? raw : ('images/' + raw);
    }

    async function init() {
      await Promise.all([loadPending(), loadRequests(), loadArticles(), loadApproved()]);
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      ['pending', 'requests', 'articles', 'approved'].forEach(id => {
        document.getElementById(`tab-${id}`).style.display = (id === tabId) ? 'block' : 'none';
      });
    }

    // --- ОЧЕРЕДЬ ---
    async function loadPending() {
      const res = await fetch('/api/pending');
      pendingData = await res.json();
      document.getElementById('count-pending').innerText = pendingData.length;
      renderPending();
    }

    function renderPending() {
      const box = document.getElementById('pending-list');
      if (!pendingData.length) {
        box.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">Очередь чиста. Все кандидаты рассмотрены.</p>';
        return;
      }

      box.innerHTML = pendingData.map(item => `
        <div class="card">
          <div class="card-img-container">
            <img src="pending/${item.filename}" style="object-position: ${item.crop_x ?? 50}% ${item.crop_y ?? 50}%">
            <div class="card-badges">
              <span class="badge-score">${item.score ?? 5}/10</span>
              <span class="badge-tag">${item.tag ?? 'КАДР'}</span>
            </div>
          </div>
          <div class="card-content">
            <div>
              <div class="card-title">${item.title ?? 'Без названия'}</div>
              <div class="card-caption">${item.caption ?? ''}</div>
            </div>
            <div class="card-actions">
              <button class="btn btn-red" onclick="rejectItem('${item.filename}')">✖ Брак [D]</button>
              <button class="btn btn-green" onclick="openApproveModal('${item.filename}')">✔ На сайт [A]</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function rejectItem(filename) {
      const res = await fetch('/api/reject', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename })
      });
      if (res.ok) await loadPending();
    }

    // --- ЗАЯВКИ И ПРАВКИ ---
    async function loadRequests() {
      const res = await fetch('/api/requests');
      requestsData = await res.json();
      document.getElementById('count-requests').innerText = requestsData.length;
      renderRequests();
    }

    function renderRequests() {
      const box = document.getElementById('requests-list');
      if (!requestsData.length) {
        box.innerHTML = '<p style="color: var(--text-muted);">Пользовательских заявок пока нет.</p>';
        return;
      }

      box.innerHTML = requestsData.map(r => {
        // Правка статьи
        if (r.type === 'article_edit') {
          return `
            <div class="request-row art-edit">
              <div style="flex: 1;">
                <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 6px;">
                  <span class="badge-tag" style="border-color: var(--accent-blue); color: var(--accent-blue);">ПРАВКА СТАТЬИ</span>
                  <span style="font-size: 12px; color: var(--text-muted);">ID: ${r.article_id}</span>
                </div>
                <div style="font-weight: 700; font-size: 15px; margin-bottom: 4px;">${r.title}</div>
                <div style="font-size: 13px; color: var(--text-muted); white-space: pre-wrap;">${r.content}</div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <button class="btn btn-green" onclick="applyArticleRequest('${r.article_id}', '${r.id}')">Принять</button>
                <button class="btn btn-gray" onclick="resolveRequest('${r.id}')">Отклонить</button>
              </div>
            </div>
          `;
        }

        // Новая статья из предложки
        if (r.type === 'suggest_article') {
          return `
            <div class="request-row art-new">
              <div style="flex: 1;">
                <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 6px;">
                  <span class="badge-tag" style="border-color: var(--accent-green); color: var(--accent-green);">НОВАЯ СТАТЬЯ</span>
                  <span style="font-size: 12px; color: var(--text-muted);">Рубрика: ${r.tag}</span>
                </div>
                <div style="font-weight: 700; font-size: 15px; margin-bottom: 4px;">${r.title}</div>
                <div style="font-size: 13px; color: var(--text-muted); white-space: pre-wrap;">${r.content}</div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <button class="btn btn-green" onclick="createArticleFromSuggest('${r.id}')">Опубликовать</button>
                <button class="btn btn-gray" onclick="resolveRequest('${r.id}')">Отклонить</button>
              </div>
            </div>
          `;
        }

        // Новое фото со ссылкой
        if (r.type === 'suggest_photo') {
          return `
            <div class="request-row photo-new">
              <div style="flex: 1;">
                <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 6px;">
                  <span class="badge-tag" style="border-color: var(--accent-purple); color: var(--accent-purple);">ПРЕДЛОЖЕННОЕ ФОТО</span>
                  <span style="font-size: 12px; color: var(--text-muted);">${r.tag}</span>
                </div>
                <div style="font-weight: 700; font-size: 15px; margin-bottom: 4px;">${r.title}</div>
                <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px;">${r.caption || ''}</div>
                <div style="font-size: 12px;"><a href="${r.photo_url}" target="_blank" style="color: var(--accent-blue); text-decoration: underline;">Открыть фото по ссылке ↗</a></div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <button class="btn btn-gray" onclick="resolveRequest('${r.id}')">Закрыть</button>
              </div>
            </div>
          `;
        }

        // Запрос на удаление существующей карточки
        if (r.type === 'delete') {
          return `
            <div class="request-row del-req">
              <img src="${r.filename.startsWith('images/') ? r.filename : 'images/' + r.filename}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 6px; background: #000;">
              <div style="flex: 1;">
                <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 4px;">
                  <span class="badge-tag" style="border-color: var(--accent-red); color: var(--accent-red);">ЗАПРОС НА УДАЛЕНИЕ</span>
                  <span style="font-size: 12px; color: var(--text-muted);">${r.filename}</span>
                </div>
                <div style="font-weight: 700;">${r.title || ''}</div>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px;">
                <button class="btn btn-red" onclick="executeDeleteCard('${r.filename}', '${r.id}')">Удалить с сайта</button>
                <button class="btn btn-gray" onclick="resolveRequest('${r.id}')">Отклонить</button>
              </div>
            </div>
          `;
        }

        // Заявка на правку карточки
        return `
          <div class="request-row">
            <img src="${r.filename.startsWith('images/') ? r.filename : 'images/' + r.filename}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 6px; background: #000;">
            <div style="flex: 1;">
              <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 4px;">
                <span class="badge-tag">ПРАВКА КАРТОЧКИ</span>
                <span style="font-size: 12px; color: var(--text-muted);">${r.filename}</span>
              </div>
              <div style="font-weight: 700; margin-bottom: 4px;">${r.title || ''}</div>
              <div style="font-size: 13px; color: var(--text-muted);">${r.caption || ''}</div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px;">
              <button class="btn btn-blue" onclick="openEditModal('${r.filename}', '${r.id}')">Настроить</button>
              <button class="btn btn-gray" onclick="resolveRequest('${r.id}')">Отклонить</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function applyArticleRequest(articleId, requestId) {
      const req = requestsData.find(r => r.id === requestId);
      if (!req) return;

      const res = await fetch('/api/articles/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          id: articleId,
          title: req.title,
          tag: req.tag,
          content: req.content,
          request_id: requestId
        })
      });

      if (res.ok) {
        await Promise.all([loadRequests(), loadArticles()]);
      }
    }

    async function createArticleFromSuggest(requestId) {
      const req = requestsData.find(r => r.id === requestId);
      if (!req) return;

      const res = await fetch('/api/articles/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: req.title,
          tag: req.tag || 'ВЕСТНИК',
          content: req.content,
          author: 'Предложка клуба',
          request_id: requestId
        })
      });

      if (res.ok) {
        await Promise.all([loadRequests(), loadArticles()]);
      }
    }

    async function executeDeleteCard(filename, requestId) {
      if (!confirm(`Точно удалить карточку ${filename} из основного состава?`)) return;
      const res = await fetch('/api/delete-card', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ filename, request_id: requestId })
      });
      if (res.ok) {
        await Promise.all([loadRequests(), loadApproved()]);
      }
    }

    async function resolveRequest(id) {
      const res = await fetch('/api/resolve-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      if (res.ok) await loadRequests();
    }

    // --- НА САЙТЕ ---
    async function loadApproved() {
      const res = await fetch('/api/data');
      approvedData = await res.json();
      document.getElementById('count-approved').innerText = approvedData.length;
      renderApproved();
    }

    function renderApproved() {
      const box = document.getElementById('approved-list');
      if (!approvedData.length) {
        box.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">Опубликованных карточек пока нет.</p>';
        return;
      }

      box.innerHTML = approvedData.map(item => `
        <div class="card">
          <div class="card-img-container">
            <img src="${resolveImagePath(item)}" style="object-position: ${item.crop_x ?? 50}% ${item.crop_y ?? 50}%">
            <div class="card-badges">
              <span class="badge-tag">${item.tag ?? 'КАДР'}</span>
            </div>
          </div>
          <div class="card-content">
            <div>
              <div class="card-title">${item.title ?? ''}</div>
              <div class="card-caption">${item.caption ?? ''}</div>
            </div>
            <div class="card-actions">
              <button class="btn btn-red" onclick="executeDeleteCard('${item.file || item.filename}', null)">Удалить</button>
              <button class="btn btn-blue" onclick="openEditModal('${item.file || item.filename}', null)">Править фокус</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // --- СТАТЬИ ---
    async function loadArticles() {
      const res = await fetch('/api/articles');
      articlesData = await res.json();
      document.getElementById('count-articles').innerText = articlesData.length;
      renderArticles();
    }

    function renderArticles() {
      const box = document.getElementById('articles-container');
      if (!articlesData.length) {
        box.innerHTML = '<p style="color: var(--text-muted);">Статей пока нет.</p>';
        return;
      }

      box.innerHTML = articlesData.map((art, index) => `
        <div style="background: var(--bg-card); border: 1px solid ${art.featured ? 'var(--accent-yellow)' : 'var(--border-color)'}; padding: 18px; border-radius: 10px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <span class="badge-tag">${art.featured ? '★ ' : ''}${art.tag}</span>
            <span style="font-size: 12px; color: var(--text-muted);">${art.date} | ${art.author}</span>
          </div>
          <h4 style="margin-bottom: 8px; font-size: 16px; color: ${art.featured ? 'var(--accent-yellow)' : '#fff'};">${art.title}</h4>
          <p style="color: var(--text-muted); font-size: 13px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 14px;">${art.content}</p>
          
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; gap: 8px;">
              <button class="btn btn-blue" onclick="editArticle('${art.id}')">✏️ Редактировать</button>
              <button class="btn btn-red" onclick="deleteArticle('${art.id}')">🗑️ Удалить</button>
            </div>
            <div style="display: flex; gap: 6px;">
              <button class="btn btn-gray" onclick="moveArticle(${index}, -1)" ${index === 0 ? 'disabled' : ''}>▲ Выше</button>
              <button class="btn btn-gray" onclick="moveArticle(${index}, 1)" ${index === articlesData.length - 1 ? 'disabled' : ''}>▼ Ниже</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function editArticle(id) {
      const art = articlesData.find(a => a.id === id);
      if (!art) return;
      document.getElementById('art-id').value = art.id;
      document.getElementById('art-title').value = art.title;
      document.getElementById('art-tag').value = art.tag;
      document.getElementById('art-author').value = art.author;
      document.getElementById('art-content').value = art.content;
      document.getElementById('art-featured').checked = !!art.featured;
      document.getElementById('article-form-header').innerText = 'Редактировать статью';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetArticleForm() {
      document.getElementById('art-id').value = '';
      document.getElementById('art-title').value = '';
      document.getElementById('art-tag').value = 'ВЕСТНИК';
      document.getElementById('art-author').value = 'Редакция';
      document.getElementById('art-content').value = '';
      document.getElementById('art-featured').checked = false;
      document.getElementById('article-form-header').innerText = 'Добавить новую статью';
    }

    async function saveArticle() {
      const payload = {
        id: document.getElementById('art-id').value || null,
        title: document.getElementById('art-title').value,
        tag: document.getElementById('art-tag').value,
        author: document.getElementById('art-author').value,
        content: document.getElementById('art-content').value,
        featured: document.getElementById('art-featured').checked
      };

      const res = await fetch('/api/articles/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        resetArticleForm();
        await loadArticles();
      } else {
        alert('Ошибка при сохранении статьи');
      }
    }

    async function deleteArticle(id) {
      if (!confirm('Удалить эту статью?')) return;
      const res = await fetch('/api/articles/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      if (res.ok) await loadArticles();
    }

    async function moveArticle(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= articlesData.length) return;

      const temp = articlesData[index];
      articlesData[index] = articlesData[newIndex];
      articlesData[newIndex] = temp;

      const res = await fetch('/api/articles/reorder', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(articlesData)
      });

      if (res.ok) renderArticles();
    }

    // --- МОДАЛЬНОЕ ОКНО КАДРИРОВАНИЯ ---
    function openApproveModal(filename) {
      const item = pendingData.find(x => x.filename === filename);
      if (!item) return;

      currentModalMode = 'approve';
      currentModalTarget = item;
      setupCropModal(`pending/${filename}`, item);
    }

    function openEditModal(filename, requestId = null) {
      let item = approvedData.find(x => (x.file === filename || x.filename === filename));
      if (!item) {
        const req = requestsData.find(r => r.id === requestId);
        item = {
          filename: filename,
          title: req ? req.title : '',
          caption: req ? req.caption : '',
          tag: 'ОСНОВА',
          crop_x: req ? (req.current_crop_x ?? 50) : 50,
          crop_y: req ? (req.current_crop_y ?? 50) : 50
        };
      }

      currentModalMode = 'update';
      currentModalTarget = { ...item, request_id: requestId };
      setupCropModal(resolveImagePath(item), currentModalTarget);
    }

    function setupCropModal(imageSrc, data) {
      cropPoint.x = data.crop_x ?? 50;
      cropPoint.y = data.crop_y ?? 50;

      const srcImg = document.getElementById('crop-src-img');
      const prevImg = document.getElementById('crop-preview-img');
      srcImg.src = imageSrc;
      prevImg.src = imageSrc;

      document.getElementById('modal-field-title').value = data.title || '';
      document.getElementById('modal-field-tag').value = data.tag || 'ФОТО';
      document.getElementById('modal-field-caption').value = data.caption || '';

      updateCropElements();
      document.getElementById('crop-modal').style.display = 'flex';

      document.getElementById('modal-btn-confirm').onclick = async () => {
        if (currentModalMode === 'approve') {
          await submitApprove();
        } else {
          await submitUpdate();
        }
      };
    }

    function closeCropModal() {
      document.getElementById('crop-modal').style.display = 'none';
      currentModalTarget = null;
    }

    function updateCropElements() {
      document.getElementById('crop-marker').style.left = `${cropPoint.x}%`;
      document.getElementById('crop-marker').style.top = `${cropPoint.y}%`;
      document.getElementById('lbl-crop-x').innerText = Math.round(cropPoint.x);
      document.getElementById('lbl-crop-y').innerText = Math.round(cropPoint.y);

      document.getElementById('crop-preview-img').style.objectPosition = `${cropPoint.x}% ${cropPoint.y}%`;
    }

    document.getElementById('crop-picker').addEventListener('click', (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const x = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
      const y = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));
      cropPoint.x = x;
      cropPoint.y = y;
      updateCropElements();
    });

    async function submitApprove() {
      const payload = {
        filename: currentModalTarget.filename,
        title: document.getElementById('modal-field-title').value,
        tag: document.getElementById('modal-field-tag').value,
        caption: document.getElementById('modal-field-caption').value,
        crop_x: Math.round(cropPoint.x),
        crop_y: Math.round(cropPoint.y)
      };

      const res = await fetch('/api/approve', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        closeCropModal();
        await Promise.all([loadPending(), loadApproved()]);
      }
    }

    async function submitUpdate() {
      const payload = {
        filename: currentModalTarget.file || currentModalTarget.filename,
        title: document.getElementById('modal-field-title').value,
        tag: document.getElementById('modal-field-tag').value,
        caption: document.getElementById('modal-field-caption').value,
        crop_x: Math.round(cropPoint.x),
        crop_y: Math.round(cropPoint.y),
        request_id: currentModalTarget.request_id || null
      };

      const res = await fetch('/api/update-card', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (res.ok) {
        closeCropModal();
        await Promise.all([loadRequests(), loadApproved()]);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (document.getElementById('crop-modal').style.display === 'flex') {
        if (e.key === 'Escape') closeCropModal();
        if (e.key === 'Enter') document.getElementById('modal-btn-confirm').click();
        return;
      }

      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (pendingData.length > 0) {
        const topItem = pendingData[0];
        if (e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф') {
          openApproveModal(topItem.filename);
        } else if (e.key === 'd' || e.key === 'D' || e.key === 'в' || e.key === 'В') {
          rejectItem(topItem.filename);
        }
      }
    });

    init();
  </script>
</body>
</html>
