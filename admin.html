<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ФК ГазМяс — Штаб модерации</title>
  <link rel="icon" type="image/png" href="symbol.png">
  <link rel="apple-touch-icon" href="symbol.png">
  <style>
    :root {
      --bg: #0c0f14;
      --card-bg: #161b22;
      --accent: #ffd700;
      --primary: #c90000;
      --green: #238636;
      --red: #da3633;
      --text: #ffffff;
      --muted: #8b949e;
      --border: #30363d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: #11141a;
      border-bottom: 2px solid var(--accent);
      padding: 0.8rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(8px);
    }
    .brand { font-size: 1.2rem; font-weight: 900; text-transform: uppercase; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .live-dot { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }

    .nav-tabs { display: flex; gap: 0.8rem; }
    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      font-size: 0.85rem;
    }
    .tab-btn.active { background: var(--primary); border-color: var(--accent); color: #fff; }

    main { flex: 1; padding: 2rem; max-width: 1400px; margin: 0 auto; width: 100%; }

    .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .gallery-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .gallery-item:hover { border-color: var(--accent); }

    .thumb-wrap { width: 100%; height: 230px; background: #000; position: relative; cursor: pointer; overflow: hidden; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .item-score {
      position: absolute; top: 8px; left: 8px; background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--accent); color: var(--accent); padding: 0.2rem 0.5rem;
      border-radius: 4px; font-weight: 800; font-size: 0.75rem; z-index: 2;
    }
    .item-tag {
      position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, 0.8);
      border: 1px solid #38bdf8; color: #38bdf8; padding: 0.2rem 0.5rem;
      border-radius: 4px; font-weight: 800; font-size: 0.75rem; text-transform: uppercase; z-index: 2;
    }

    .item-info { padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; flex: 1; min-height: 125px; cursor: pointer; }
    .item-title { font-size: 0.95rem; font-weight: 800; color: #fff; line-height: 1.3; }
    .item-caption { font-size: 0.85rem; color: var(--muted); line-height: 1.45; }

    .item-actions { display: flex; border-top: 1px solid var(--border); }
    .item-btn {
      flex: 1; padding: 0.75rem; border: none; font-size: 0.85rem; font-weight: 800;
      text-transform: uppercase; cursor: pointer;
    }
    .item-btn.btn-approve { background: rgba(35, 134, 54, 0.25); color: #4ade80; border-left: 1px solid var(--border); }
    .item-btn.btn-approve:hover { background: var(--green); color: #fff; }
    .item-btn.btn-reject { background: rgba(218, 54, 51, 0.25); color: #f87171; }
    .item-btn.btn-reject:hover { background: var(--red); color: #fff; }

    .requests-list { display: flex; flex-direction: column; gap: 1rem; }
    .req-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 1.2rem; display: grid; grid-template-columns: 140px 1fr 180px; gap: 1.5rem; align-items: start;
    }
    .req-thumb { width: 140px; height: 105px; background: #000; border-radius: 6px; overflow: hidden; margin-top: 4px; }
    .req-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .req-badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; margin-bottom: 6px; }
    .req-badge.delete { background: rgba(218, 54, 51, 0.3); color: #f87171; border: 1px solid var(--red); }
    .req-badge.edit { background: rgba(255, 215, 0, 0.2); color: var(--accent); border: 1px solid var(--accent); }
    
    .req-actions { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 4px; }
    .req-btn { padding: 0.65rem; border: none; border-radius: 6px; font-weight: 800; text-transform: uppercase; font-size: 0.8rem; cursor: pointer; }

    .req-input-title {
      background: #0d1117; border: 1px solid var(--accent); color: #fff;
      padding: 8px 10px; border-radius: 4px; font-weight: 700; width: 100%;
      font-size: 0.95rem; margin-bottom: 6px;
    }
    .req-input-caption {
      background: #0d1117; border: 1px solid var(--border); color: #fff;
      padding: 8px 10px; border-radius: 4px; font-size: 0.85rem; width: 100%;
      min-height: 60px; resize: vertical; font-family: inherit;
    }
    .req-input-title:focus, .req-input-caption:focus { outline: none; border-color: var(--accent); }

    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(10px); z-index: 100; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-wrapper { display: flex; align-items: center; gap: 1rem; width: 100%; max-width: 1100px; }
    .nav-arrow {
      background: rgba(22, 27, 34, 0.9); border: 2px solid var(--border); color: var(--accent);
      width: 50px; height: 50px; border-radius: 50%; font-size: 1.6rem; font-weight: 900; cursor: pointer; flex-shrink: 0;
    }
    .moderation-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
      width: 100%; display: grid; grid-template-columns: 1.25fr 1fr; gap: 1.5rem; overflow: hidden; position: relative;
    }
    .close-modal-btn { position: absolute; top: 10px; right: 12px; background: transparent; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; z-index: 10; }

    /* КОНТЕЙНЕР КАДРИРОВАНИЯ */
    .image-preview {
      background: #05070a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 440px;
      user-select: none;
      overflow: hidden;
    }

    .crop-viewport {
      position: relative;
      display: inline-block;
      max-width: 100%;
      max-height: 480px;
      line-height: 0;
    }

    .crop-viewport img {
      max-width: 100%;
      max-height: 480px;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ЗАТЕМНЕНИЕ И ПЕРЕМЕЩАЕМАЯ РАМКА */
    .crop-box {
      position: absolute;
      box-sizing: border-box;
      border: 2px solid var(--accent);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
      cursor: grab;
      touch-action: none;
    }
    .crop-box:active { cursor: grabbing; border-color: #fff; }

    .crop-box::after {
      content: "ВИД В ГАЛЕРЕЕ";
      position: absolute;
      bottom: 4px;
      right: 6px;
      background: rgba(0, 0, 0, 0.75);
      color: var(--accent);
      font-size: 0.65rem;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 3px;
      pointer-events: none;
      letter-spacing: 0.5px;
    }

    .form-pane { padding: 1.5rem 1.5rem 1.5rem 0; display: flex; flex-direction: column; gap: 1rem; }
    .field-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .field-group label { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); font-weight: 700; }
    .field-group input, .field-group textarea {
      background: #0d1117; border: 1px solid var(--border); color: #fff; padding: 0.65rem; border-radius: 6px; font-size: 0.95rem; font-family: inherit;
    }
    .field-group textarea { min-height: 90px; resize: vertical; }
    .modal-actions { display: flex; gap: 1rem; margin-top: auto; padding-top: 1rem; }
    .btn-approve-lg { background: var(--green); color: #fff; padding: 0.8rem; border: none; border-radius: 6px; font-weight: 800; cursor: pointer; flex: 1; text-transform: uppercase; }
    .btn-reject-lg { background: var(--red); color: #fff; padding: 0.8rem; border: none; border-radius: 6px; font-weight: 800; cursor: pointer; flex: 1; text-transform: uppercase; }
    .empty-state { text-align: center; padding: 4rem 1rem; color: var(--muted); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="live-dot" title="Автосинхронизация активна"></span>
      ФК ГазМяс — Админка
    </div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="tabCandidatesBtn" onclick="switchTab('candidates')">Очередь (0)</button>
      <button class="tab-btn" id="tabRequestsBtn" onclick="switchTab('requests')">Заявки посетителей (0)</button>
    </div>
  </header>

  <main>
    <div id="candidatesView">
      <div id="galleryContainer" class="gallery-grid"></div>
      <div class="empty-state" id="emptyCandidates" style="display: none;">
        <h2>Очередь чиста!</h2>
        <p style="margin-top: 0.5rem;">Кандидаты от Gemini и предложка появятся здесь.</p>
      </div>
    </div>

    <div id="requestsView" style="display: none;">
      <div id="requestsContainer" class="requests-list"></div>
      <div class="empty-state" id="emptyRequests" style="display: none;">
        <h2>Заявок нет!</h2>
        <p style="margin-top: 0.5rem;">Посетители пока не присылали правок или жалоб.</p>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="modalOverlay" onclick="handleBackdropClick(event)">
    <div class="modal-wrapper">
      <button class="nav-arrow" id="prevBtn" onclick="navigateModal(-1)">←</button>
      <div class="moderation-card">
        <button class="close-modal-btn" onclick="closeModal()">✕</button>
        <div class="image-preview">
          <div class="crop-viewport" id="cropViewport">
            <img id="modalImg" src="" alt="Preview">
            <div class="crop-box" id="cropBox"></div>
          </div>
        </div>
        <div class="form-pane">
          <div class="field-group">
            <label>Заголовок (Title)</label>
            <input type="text" id="modalTitle">
          </div>
          <div class="field-group">
            <label>Тег</label>
            <input type="text" id="modalTag">
          </div>
          <div class="field-group">
            <label>Панчлайн (Caption)</label>
            <textarea id="modalCaption"></textarea>
          </div>
          <div class="modal-actions">
            <button class="btn-reject-lg" onclick="moderateCurrent('reject')">В корзину [D]</button>
            <button class="btn-approve-lg" onclick="moderateCurrent('approve')">Одобрить [A]</button>
          </div>
        </div>
      </div>
      <button class="nav-arrow" id="nextBtn" onclick="navigateModal(1)">→</button>
    </div>
  </div>

  <script>
    let queue = [];
    let userRequests = [];
    let currentModalIndex = -1;
    let isBusy = false;

    // Параметры кадрирования (аспектное соотношение карточки 280 / 230)
    const TARGET_ASPECT = 280 / 230;
    let cropPercentX = 50;
    let cropPercentY = 50;
    let isDraggingCrop = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let cropBoxLeft = 0;
    let cropBoxTop = 0;
    let maxCropBoxLeft = 0;
    let maxCropBoxTop = 0;

    async function loadData() {
      if (isBusy) return;
      await Promise.all([fetchQueue(), fetchRequests()]);
    }

    async function fetchQueue() {
      try {
        const res = await fetch("/api/pending?t=" + Date.now());
        const data = await res.json();
        if (JSON.stringify(data) !== JSON.stringify(queue)) {
          queue = data;
          document.getElementById("tabCandidatesBtn").textContent = `Очередь (${queue.length})`;
          renderGallery();
        }
      } catch (e) {}
    }

    async function fetchRequests() {
      try {
        const res = await fetch("/api/requests?t=" + Date.now());
        const data = await res.json();
        if (JSON.stringify(data) !== JSON.stringify(userRequests)) {
          userRequests = data;
          document.getElementById("tabRequestsBtn").textContent = `Заявки посетителей (${userRequests.length})`;
          renderRequests();
        }
      } catch (e) {}
    }

    function switchTab(tab) {
      document.getElementById("tabCandidatesBtn").classList.toggle("active", tab === 'candidates');
      document.getElementById("tabRequestsBtn").classList.toggle("active", tab === 'requests');
      document.getElementById("candidatesView").style.display = tab === 'candidates' ? 'block' : 'none';
      document.getElementById("requestsView").style.display = tab === 'requests' ? 'block' : 'none';
    }

    function renderGallery() {
      const container = document.getElementById("galleryContainer");
      const emptyState = document.getElementById("emptyCandidates");

      if (!queue || queue.length === 0) {
        container.innerHTML = "";
        emptyState.style.display = "block";
        closeModal();
        return;
      }

      emptyState.style.display = "none";
      container.innerHTML = "";

      queue.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "gallery-item";
        const imgSrc = item.image || item.file || item.temp_file || "";
        const objPos = `${item.crop_x ?? 50}% ${item.crop_y ?? 50}%`;

        card.innerHTML = `
          <div class="thumb-wrap" onclick="openModal(${index})">
            <img src="${imgSrc}" alt="thumb" loading="lazy" style="object-position: ${objPos};">
            <div class="item-score">${item.score || 7}/10</div>
            <div class="item-tag">${escapeHtml(item.tag || 'Основа')}</div>
          </div>
          <div class="item-info" onclick="openModal(${index})">
            <div class="item-title">${escapeHtml(item.title || 'Без названия')}</div>
            <div class="item-caption">${escapeHtml(item.caption || '')}</div>
          </div>
          <div class="item-actions">
            <button class="item-btn btn-reject" onclick="quickModerate(${index}, 'reject')">✕ Брак</button>
            <button class="item-btn btn-approve" onclick="quickModerate(${index}, 'approve')">✓ На сайт</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderRequests() {
      const container = document.getElementById("requestsContainer");
      const emptyState = document.getElementById("emptyRequests");

      if (!userRequests || userRequests.length === 0) {
        container.innerHTML = "";
        emptyState.style.display = "block";
        return;
      }

      emptyState.style.display = "none";
      container.innerHTML = "";

      userRequests.forEach((req) => {
        const row = document.createElement("div");
        row.className = "req-card";
        const isDelete = req.type === 'delete';
        const badge = isDelete 
          ? '<span class="req-badge delete">Удаление кадра</span>' 
          : '<span class="req-badge edit">Правка описания</span>';

        const editFieldsHtml = isDelete ? `
          <div style="margin-top: 4px;"><strong>Было:</strong> ${escapeHtml(req.current_title)} — ${escapeHtml(req.current_caption)}</div>
        ` : `
          <div style="font-size: 0.8rem; color: var(--muted); margin-bottom: 6px;">
            <strong>В базе:</strong> ${escapeHtml(req.current_title)} — ${escapeHtml(req.current_caption)}
          </div>
          <div style="display: flex; flex-direction: column;">
            <input type="text" id="edit_title_${req.id}" class="req-input-title" 
                   value="${escapeHtml(req.new_title || req.current_title)}" 
                   placeholder="Заголовок">
            <textarea id="edit_caption_${req.id}" class="req-input-caption" 
                      placeholder="Описание / Панчлайн">${escapeHtml(req.new_caption || req.current_caption)}</textarea>
          </div>
        `;

        row.innerHTML = `
          <div class="req-thumb"><img src="${req.file}" alt="Thumb" loading="lazy"></div>
          <div>
            ${badge}
            <div style="color: var(--muted); font-size: 0.75rem; margin-bottom: 6px;">Время заявки: ${req.time}</div>
            ${editFieldsHtml}
          </div>
          <div class="req-actions">
            <button class="req-btn" style="background: var(--green); color:#fff;" onclick="resolveRequest('${req.id}', 'apply')">Применить</button>
            <button class="req-btn" style="background: rgba(255,255,255,0.1); color: var(--muted);" onclick="resolveRequest('${req.id}', 'dismiss')">Отклонить</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    async function resolveRequest(reqId, action) {
      isBusy = true;
      try {
        let customTitle = null;
        let customCaption = null;

        const titleInput = document.getElementById(`edit_title_${reqId}`);
        const captionInput = document.getElementById(`edit_caption_${reqId}`);

        if (titleInput && captionInput) {
          customTitle = titleInput.value.trim();
          customCaption = captionInput.value.trim();
        }

        await fetch("/api/handle_request", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            id: reqId, 
            action: action,
            custom_title: customTitle,
            custom_caption: customCaption
          })
        });

        userRequests = userRequests.filter(x => x.id !== reqId);
        document.getElementById("tabRequestsBtn").textContent = `Заявки посетителей (${userRequests.length})`;
        renderRequests();
      } finally {
        isBusy = false;
      }
    }

    function openModal(index) {
      if (index < 0 || index >= queue.length) return;
      currentModalIndex = index;
      const item = queue[index];

      cropPercentX = item.crop_x !== undefined ? item.crop_x : 50;
      cropPercentY = item.crop_y !== undefined ? item.crop_y : 50;

      const img = document.getElementById("modalImg");
      img.onload = () => setupCropBox();
      img.src = item.image || item.file || item.temp_file || "";

      document.getElementById("modalTitle").value = item.title || "";
      document.getElementById("modalTag").value = item.tag || "Основа";
      document.getElementById("modalCaption").value = item.caption || "";

      document.getElementById("prevBtn").disabled = (index === 0);
      document.getElementById("nextBtn").disabled = (index === queue.length - 1);
      document.getElementById("modalOverlay").style.display = "flex";

      if (img.complete && img.naturalWidth) {
        setupCropBox();
      }
    }

    function setupCropBox() {
      const img = document.getElementById("modalImg");
      const box = document.getElementById("cropBox");
      const w = img.clientWidth;
      const h = img.clientHeight;

      if (!w || !h) return;

      const imgAspect = w / h;
      let bw, bh;

      if (imgAspect > TARGET_ASPECT) {
        bh = h;
        bw = Math.round(bh * TARGET_ASPECT);
      } else {
        bw = w;
        bh = Math.round(bw / TARGET_ASPECT);
      }

      box.style.width = bw + "px";
      box.style.height = bh + "px";

      maxCropBoxLeft = Math.max(0, w - bw);
      maxCropBoxTop = Math.max(0, h - bh);

      cropBoxLeft = Math.round((cropPercentX / 100) * maxCropBoxLeft);
      cropBoxTop = Math.round((cropPercentY / 100) * maxCropBoxTop);

      box.style.left = cropBoxLeft + "px";
      box.style.top = cropBoxTop + "px";
    }

    // Обработка перетаскивания рамки
    const cropBox = document.getElementById("cropBox");

    cropBox.addEventListener("pointerdown", (e) => {
      isDraggingCrop = true;
      dragStartX = e.clientX - cropBoxLeft;
      dragStartY = e.clientY - cropBoxTop;
      cropBox.setPointerCapture(e.pointerId);
    });

    cropBox.addEventListener("pointermove", (e) => {
      if (!isDraggingCrop) return;
      let newLeft = e.clientX - dragStartX;
      let newTop = e.clientY - dragStartY;

      newLeft = Math.max(0, Math.min(newLeft, maxCropBoxLeft));
      newTop = Math.max(0, Math.min(newTop, maxCropBoxTop));

      cropBoxLeft = newLeft;
      cropBoxTop = newTop;

      cropBox.style.left = cropBoxLeft + "px";
      cropBox.style.top = cropBoxTop + "px";

      cropPercentX = maxCropBoxLeft > 0 ? Math.round((cropBoxLeft / maxCropBoxLeft) * 100) : 50;
      cropPercentY = maxCropBoxTop > 0 ? Math.round((cropBoxTop / maxCropBoxTop) * 100) : 50;
    });

    cropBox.addEventListener("pointerup", (e) => {
      isDraggingCrop = false;
      try { cropBox.releasePointerCapture(e.pointerId); } catch(err) {}
    });

    function closeModal() {
      document.getElementById("modalOverlay").style.display = "none";
      currentModalIndex = -1;
    }

    function handleBackdropClick(e) {
      if (e.target.id === "modalOverlay") closeModal();
    }

    function navigateModal(direction) {
      const newIndex = currentModalIndex + direction;
      if (newIndex >= 0 && newIndex < queue.length) openModal(newIndex);
    }

    async function moderateCurrent(action) {
      if (isBusy || currentModalIndex < 0 || currentModalIndex >= queue.length) return;
      isBusy = true;
      const current = queue[currentModalIndex];

      try {
        await fetch("/api/moderate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: action,
            id: current.id,
            title: document.getElementById("modalTitle").value.trim(),
            tag: document.getElementById("modalTag").value.trim(),
            caption: document.getElementById("modalCaption").value.trim(),
            crop_x: cropPercentX,
            crop_y: cropPercentY
          })
        });

        queue.splice(currentModalIndex, 1);
        document.getElementById("tabCandidatesBtn").textContent = `Очередь (${queue.length})`;
        renderGallery();

        if (queue.length === 0) closeModal();
        else openModal(Math.min(currentModalIndex, queue.length - 1));
      } finally {
        isBusy = false;
      }
    }

    async function quickModerate(index, action) {
      if (isBusy || index < 0 || index >= queue.length) return;
      isBusy = true;
      const item = queue[index];

      try {
        await fetch("/api/moderate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: action,
            id: item.id,
            title: item.title,
            tag: item.tag,
            caption: item.caption,
            crop_x: item.crop_x ?? 50,
            crop_y: item.crop_y ?? 50
          })
        });

        queue.splice(index, 1);
        document.getElementById("tabCandidatesBtn").textContent = `Очередь (${queue.length})`;
        renderGallery();
      } finally {
        isBusy = false;
      }
    }

    function escapeHtml(str) {
      return (str || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    window.addEventListener("keydown", (e) => {
      const isModalOpen = document.getElementById("modalOverlay").style.display === "flex";
      if (e.key === "Escape" && isModalOpen) closeModal();
      if (isModalOpen && !["INPUT", "TEXTAREA"].includes(document.activeElement.tagName)) {
        if (e.key === "ArrowLeft") navigateModal(-1);
        else if (e.key === "ArrowRight") navigateModal(1);
        else if (e.key === "a" || e.key === "A" || e.key === "Enter") moderateCurrent("approve");
        else if (e.key === "d" || e.key === "D" || e.key === "Delete") moderateCurrent("reject");
      }
    });

    loadData();
    setInterval(loadData, 3000);
  </script>
</body>
</html>
